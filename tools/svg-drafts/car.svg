  <path d="M212 132h72" stroke="#0469fa" stroke-width="5" stroke-linecap="round" opacity=".5" fill="none"/>
  <path d="M206 156h560" stroke="#ffffff" stroke-width="3" opacity=".5" stroke-linecap="round" fill="none"/>

  <!-- lights -->
  <path d="M700 118c22 2 34 8 38 16-4 8-18 14-40 16l-8-16z" fill="#eafcff"/>
  <path d="M700 118c22 2 34 8 38 16-4 8-18 14-40 16l-8-16z" fill="#7cf0ff" opacity=".75" filter="url(#ca1b1)"/>
  <path d="M178 116c10-2 18 0 22 4l-2 18c-6 2-14 2-22-2z" fill="#0469fa"/>
  <path d="M178 116c10-2 18 0 22 4l-2 18c-6 2-14 2-22-2z" fill="#39b6ff" opacity=".7" filter="url(#ca1b2)"/>

