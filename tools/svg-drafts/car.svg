  <path d="M176 152c-4-20 0-36 16-44l108-8c22-22 48-38 78-42 42-6 74-4 100 4 24 8 46 24 68 40l146 8c32 4 52 16 56 34 2 12-2 20-12 20H200c-16 0-24-4-24-12z" fill="url(#ca1body)"/>

