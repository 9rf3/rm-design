  <path d="M330 96c20-16 40-28 62-32 32-6 58-4 78 2" stroke="#7fd8ff" stroke-width="3" stroke-linecap="round" opacity=".45" fill="none"/>
  <path d="M430 62 444 102" stroke="#ffffff" stroke-width="6" opacity=".9" fill="none"/>

  <!-- wheels -->
  <g>
