<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="780" height="260">
  <defs>
    <linearGradient id="ca1body" x1="0" y1="56" x2="0" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#fafdff"/>
      <stop offset=".76" stop-color="#e2eaf6"/>
      <stop offset="1" stop-color="#b8c9e0"/>
    </linearGradient>
    <linearGradient id="ca1glass" x1="0" y1="58" x2="0" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b5089"/>
      <stop offset=".55" stop-color="#0c2a52"/>
      <stop offset="1" stop-color="#06142b"/>
    </linearGradient>
    <linearGradient id="ca1rim" x1="0" y1="126" x2="0" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f8fd"/>
      <stop offset="1" stop-color="#aebed4"/>
    </linearGradient>
    <linearGradient id="ca1accent" x1="300" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0469fa" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#12b6ff"/>
      <stop offset="1" stop-color="#8af3ff"/>
    </linearGradient>
    <linearGradient id="ca1trail" x1="14" y1="0" x2="182" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#37d4ff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#37d4ff" stop-opacity=".4"/>
      <stop offset=".84" stop-color="#6ce8ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="ca1glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7ef0ff" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#2aa6ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2aa6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ca1b1" x="-80%" y="-300%" width="260%" height="700%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="ca1b2" x="-80%" y="-500%" width="260%" height="1100%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="ca1b3" x="-80%" y="-400%" width="260%" height="900%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <!-- motion trail -->
  <g>
    <ellipse cx="168" cy="134" rx="120" ry="36" fill="url(#ca1glow)" filter="url(#ca1b3)"/>
    <rect x="14" y="128" width="170" height="11" rx="5.5" fill="url(#ca1trail)" filter="url(#ca1b1)" opacity=".9"/>
    <rect x="70" y="110" width="120" height="5" rx="2.5" fill="url(#ca1trail)" filter="url(#ca1b2)" opacity=".55"/>
    <rect x="44" y="154" width="146" height="5" rx="2.5" fill="url(#ca1trail)" filter="url(#ca1b2)" opacity=".5"/>
    <rect x="118" y="132" width="74" height="4" rx="2" fill="#e8fcff" filter="url(#ca1b2)" opacity=".9"/>
  </g>

